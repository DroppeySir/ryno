<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RYNO Rating</title>
<meta name="description" content="College football ratings and bets">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RYNO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1A13" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F2F4F1; }
  @media (prefers-color-scheme: dark) { html, body { background: #0D1A13; } }
  /* the app fills the screen, kept clear of the iPhone notch when opened from the home screen (the app keeps its own tab bar above the home bar) */
  #wrap { position: fixed; top: env(safe-area-inset-top, 0px); bottom: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); overflow: hidden; }
  #wrap iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="wrap"><iframe id="app" title="RYNO Rating" allow="clipboard-write"></iframe></div>
<script>
/* ===== Paste your web app link (the one ending in /exec) between the quotes below. ===== */
var APP_URL = 'PASTE_YOUR_WEB_APP_LINK_HERE';

/* Safari forgets what an app saves while it's shown inside another site's page, so this page keeps the app's own saved
   items (sign-in, settings, instant-load copy, Top 10 memory, parlay slip) and hands them back when the app opens.
   It only ever talks to Google's app frame inside this page, and it only stores the app's own items. */
var KEYS = ['cfb_me_v1', 'cfb_app_v1', 'cfb_t10_v1', 'cfb_slip_v1', 'ryno_guide_seen_v1', 'cfb_hello_at'];
var PREFIX = 'ryno_keep:';
var APP_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
var frame = document.getElementById('app');
frame.src = APP_URL + (location.search || '');          // a shared link (?view=…) opens the same screen

function fromOurApp(src) {                              // the message came from a frame inside our own iframe
  try { for (var w = src, i = 0; w && i < 6; i++) { if (w === frame.contentWindow) return true; if (w === w.parent) break; w = w.parent; } } catch (e) { }
  return false;
}
var wrap = document.getElementById('wrap'), room = 0, fitAt = 0;
function fit() { fitAt = Date.now(); frame.style.height = room ? (wrap.clientHeight + room) + 'px' : ''; }   // stretch Google's frame so its empty room sits below the screen
window.addEventListener('resize', fit);
function store() { try { return window.localStorage; } catch (e) { return null; } }
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.ryno !== 1 || !APP_ORIGIN.test(e.origin) || !fromOurApp(e.source)) return;
  var ls = store();
  if (d.t === 'get') {
    var items = {};
    if (ls) KEYS.forEach(function (k) { var v = null; try { v = ls.getItem(PREFIX + k); } catch (x) { } if (v !== null) items[k] = v; });
    e.source.postMessage({ ryno: 1, t: 'data', items: items }, e.origin);
  } else if (d.t === 'set' && ls && KEYS.indexOf(d.k) >= 0 && typeof d.v === 'string' && d.v.length < 4000000) {
    try { ls.setItem(PREFIX + d.k, d.v); } catch (x) { }
  } else if (d.t === 'del' && ls && KEYS.indexOf(d.k) >= 0) {
    try { ls.removeItem(PREFIX + d.k); } catch (x) { }
  } else if (d.t === 'size' && typeof d.h === 'number' && d.h > 100 && d.h < 4000) {
    var r = frame.getBoundingClientRect().height - d.h;                   // the empty room Google's frame keeps below the app
    if (r >= 0 && r < 400 && Math.abs(r - room) > 1 && Date.now() - fitAt > 1000) { room = r; fit(); }   // (a report from before the last stretch is ignored)
  } else if (d.t === 'nav' && typeof d.q === 'string' && /^(\?[\w=&%.~+\-:,|]*)?$/.test(d.q) && d.q.length < 500) {
    try { history.replaceState(null, '', location.pathname + d.q); } catch (x) { }   // the address bar follows the screen you're on
  }
});
</script>
</body>
</html>
